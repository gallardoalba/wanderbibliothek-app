name: CI

# Ciclo de la app Android: pruebas de JVM (modelos, formatos, diccionarios),
# lint y APK de depuración. Antes vivía dentro del repositorio del servidor y
# se ejecutaba con `working-directory: android`; al separar la app, el
# directorio de trabajo es la raíz.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # v3 intentaba instalar el paquete obsoleto «tools», que ya no existe en
      # el repositorio del SDK, y el trabajo moría en «Failed to find package
      # 'tools'». v4 usa las cmdline-tools actuales.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Instalar plataforma y build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Android 17 (API 37) lleva la versión menor en el nombre del paquete:
          # «platforms;android-37» no existe, el identificador es «android-37.0».
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Pruebas, lint y APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
